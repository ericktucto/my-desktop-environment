# hypridle: solo conecta el bloqueo con el sistema. Los tiempos de inactividad
# (atenuar, bloquear, apagar la pantalla y suspender) los maneja la shell (IdleStore).
general {
    # Pantalla de bloqueo de la shell; si qs no corre, hyprlock (hypr/hyprlock.conf)
    lock_cmd = qs ipc call stixshell@lock lock || (pidof hyprlock || hyprlock)
    # Bloquear antes de dormir (tapa, suspender, loginctl suspend)
    before_sleep_cmd = loginctl lock-session
    # Al despertar, encender la pantalla
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    # Esperar a que el bloqueo esté puesto antes de dejar dormir (segundos)
    inhibit_sleep = 3
}

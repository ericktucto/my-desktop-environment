# hyprlock con los colores de la shell (Theme.qml). Formato hyprlang, no Lua.

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    inner_color = rgba(10, 10, 15, 1.0)
    outer_color = rgba(2979ffff)
    check_color = rgba(00e676ff)
    fail_color = rgba(ff1744ff)
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    rounding = 26
    font_family = Inter
    placeholder_text = Contraseña…
    fail_text = $PAMFAIL
    dots_spacing = 0.3
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    color = rgb(255, 255, 255)
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d de %B"
    font_size = 22
    font_family = Inter
    color = rgb(180, 188, 208)
    position = 0, 110
    halign = center
    valign = center
}
